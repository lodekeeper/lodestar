name: Build and publish Docker images

on:
  workflow_call:
    inputs:
      tag:
        description: "Docker image tag"
        required: true
        type: string
      extra-tags:
        description: "Extra tags to apply (comma-separated, e.g. 'latest,rc')"
        required: false
        type: string
      ref:
        description: "Git ref to checkout (defaults to triggering ref)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
  packages: write

jobs:
  docker:
    name: Build Docker (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push lodestar
        run: >
          docker buildx build . --push --provenance=false --sbom=false
          --tag ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }}-${{ matrix.arch }}
          --platform linux/${{ matrix.arch }}
          --build-arg COMMIT=$(git rev-parse HEAD)

      - name: Sanity check lodestar (${{ matrix.arch }})
        run: |
          docker run -d --name lodestar-sanity-${{ matrix.arch }} -p 9596:9596 ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }}-${{ matrix.arch }} dev --rest.address 0.0.0.0
          sleep 30
          curl -f http://127.0.0.1:9596/eth/v1/node/version || (docker logs lodestar-sanity-${{ matrix.arch }} && exit 1)
          docker stop lodestar-sanity-${{ matrix.arch }}

      - name: Build and push custom Grafana
        run: >
          docker buildx build ./docker/grafana/ --push --provenance=false --sbom=false
          --file ./docker/grafana/Dockerfile
          --build-context dashboards=./dashboards
          --tag ghcr.io/lodekeeper/lodestar-grafana-e2e:${{ inputs.tag }}-${{ matrix.arch }}
          --platform linux/${{ matrix.arch }}

      - name: Build and push custom Prometheus
        run: >
          docker buildx build ./docker/prometheus/ --push --provenance=false --sbom=false
          --file ./docker/prometheus/Dockerfile
          --tag ghcr.io/lodekeeper/lodestar-prometheus-e2e:${{ inputs.tag }}-${{ matrix.arch }}
          --platform linux/${{ matrix.arch }}

      - name: Resolve image digests
        id: image_digests
        run: |
          echo "lodestar=$(docker buildx imagetools inspect ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }}-${{ matrix.arch }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "grafana=$(docker buildx imagetools inspect ghcr.io/lodekeeper/lodestar-grafana-e2e:${{ inputs.tag }}-${{ matrix.arch }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "prometheus=$(docker buildx imagetools inspect ghcr.io/lodekeeper/lodestar-prometheus-e2e:${{ inputs.tag }}-${{ matrix.arch }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Attest lodestar image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-e2e
          subject-digest: ${{ steps.image_digests.outputs.lodestar }}
          push-to-registry: true

      - name: Attest Grafana image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-grafana-e2e
          subject-digest: ${{ steps.image_digests.outputs.grafana }}
          push-to-registry: true

      - name: Attest Prometheus image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-prometheus-e2e
          subject-digest: ${{ steps.image_digests.outputs.prometheus }}
          push-to-registry: true

      - name: Generate lodestar image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/lodekeeper/lodestar-e2e@${{ steps.image_digests.outputs.lodestar }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          output-file: lodestar-${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest lodestar image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-e2e
          subject-digest: ${{ steps.image_digests.outputs.lodestar }}
          sbom-path: lodestar-${{ matrix.arch }}.sbom.spdx.json
          push-to-registry: true

      - name: Generate Grafana image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/lodekeeper/lodestar-grafana-e2e@${{ steps.image_digests.outputs.grafana }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          output-file: lodestar-grafana-${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Grafana image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-grafana-e2e
          subject-digest: ${{ steps.image_digests.outputs.grafana }}
          sbom-path: lodestar-grafana-${{ matrix.arch }}.sbom.spdx.json
          push-to-registry: true

      - name: Generate Prometheus image SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/lodekeeper/lodestar-prometheus-e2e@${{ steps.image_digests.outputs.prometheus }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ github.token }}
          output-file: lodestar-prometheus-${{ matrix.arch }}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest Prometheus image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-prometheus-e2e
          subject-digest: ${{ steps.image_digests.outputs.prometheus }}
          sbom-path: lodestar-prometheus-${{ matrix.arch }}.sbom.spdx.json
          push-to-registry: true

  docker-manifest:
    name: Create Docker manifest
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create and push lodestar manifest
        run: |
          EXTRA_TAGS=""
          if [ -n "${{ inputs.extra-tags }}" ]; then
            for t in $(echo "${{ inputs.extra-tags }}" | tr ',' ' '); do
              EXTRA_TAGS="$EXTRA_TAGS -t ghcr.io/lodekeeper/lodestar-e2e:$t"
            done
          fi
          docker buildx imagetools create -t ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }} $EXTRA_TAGS \
            ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }}-amd64 \
            ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }}-arm64

      - name: Create and push grafana manifest
        run: |
          docker buildx imagetools create -t ghcr.io/lodekeeper/lodestar-grafana-e2e:${{ inputs.tag }} \
            ghcr.io/lodekeeper/lodestar-grafana-e2e:${{ inputs.tag }}-amd64 \
            ghcr.io/lodekeeper/lodestar-grafana-e2e:${{ inputs.tag }}-arm64

      - name: Create and push prometheus manifest
        run: |
          docker buildx imagetools create -t ghcr.io/lodekeeper/lodestar-prometheus-e2e:${{ inputs.tag }} \
            ghcr.io/lodekeeper/lodestar-prometheus-e2e:${{ inputs.tag }}-amd64 \
            ghcr.io/lodekeeper/lodestar-prometheus-e2e:${{ inputs.tag }}-arm64

      - name: Verify lodestar manifest
        run: |
          docker pull ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }}
          docker image history ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }}

      - name: Resolve manifest digests
        id: manifest_digests
        run: |
          echo "lodestar=$(docker buildx imagetools inspect ghcr.io/lodekeeper/lodestar-e2e:${{ inputs.tag }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "grafana=$(docker buildx imagetools inspect ghcr.io/lodekeeper/lodestar-grafana-e2e:${{ inputs.tag }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "prometheus=$(docker buildx imagetools inspect ghcr.io/lodekeeper/lodestar-prometheus-e2e:${{ inputs.tag }} --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"

      - name: Attest lodestar manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-e2e
          subject-digest: ${{ steps.manifest_digests.outputs.lodestar }}
          push-to-registry: true

      - name: Attest Grafana manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-grafana-e2e
          subject-digest: ${{ steps.manifest_digests.outputs.grafana }}
          push-to-registry: true

      - name: Attest Prometheus manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/lodekeeper/lodestar-prometheus-e2e
          subject-digest: ${{ steps.manifest_digests.outputs.prometheus }}
          push-to-registry: true
