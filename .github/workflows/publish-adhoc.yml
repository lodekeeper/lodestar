name: Publish ad-hoc Docker images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build from (branch, tag, or commit SHA)"
        required: true
        type: string
      tag:
        description: "Docker image tag"
        required: true
        type: string
      push:
        description: "Push images to Docker Hub"
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Validate inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Validate ref exists
        run: |
          echo "Building from ref: ${{ inputs.ref }}"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Tag: ${{ inputs.tag }}"
          echo "Push: ${{ inputs.push }}"

  build:
    needs: validate
    uses: ./.github/workflows/docker.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
    if: ${{ inputs.push }}

  build-dry-run:
    name: Build Docker (dry run)
    needs: validate
    if: ${{ !inputs.push }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build lodestar (no push)
        run: |
          docker buildx build . \
            --tag chainsafe/lodestar:${{ inputs.tag }} \
            --build-arg COMMIT=$(git rev-parse HEAD)
          echo "✅ Build successful (dry run - not pushed)"
